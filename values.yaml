replicaCount: 2

image:
  repository: nareshyovi/node-app
  tag: "V5"
  pullPolicy: IfNotPresent

containerPort: 3000

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: nginx
  host: n8nnaresh.duckdns.org
  tlsSecretName: node-app-tls
  clusterIssuer: letsencrypt-prod

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
