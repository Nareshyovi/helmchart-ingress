apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Nareshyovi/helmchart-ingress.git
    targetRevision: main
    path: helm/node-app
    helm:
      releaseName: node-app
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
